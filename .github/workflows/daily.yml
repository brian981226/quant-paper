name: daily-update

on:
  schedule:
    - cron: "23 6 * * 1-5"   # 台灣時間週一到週五 14:23（收盤後）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run strategies and build site
        run: python run.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
          git push
